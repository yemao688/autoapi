version: '3'

# Wails v3 build tasks. `wails3 build`, `wails3 package`, `wails3 run` and
# `wails3 dev` all dispatch here (wails3 embeds the go-task runner).
#
# Build variables (pass as CLI vars, e.g. `wails3 task build VERSION=1.2.3`):
#   DEV=true   development build: `dev` tag (development data profile), no
#              stripping, kept inlining. Production builds use `production`.
#   GOOS       target OS (defaults to the host); windows builds are CGO-free.
#   ARCH       target arch (defaults to GOARCH, then the host); windows builds
#              generate a matching wails_windows_<arch>.syso resource.
#   VERSION    value for main.appVersion (default "dev")
#   BUILD      value for main.appBuild (default empty -> git hash fallback)

vars:
  APP_NAME: autoapi
  APP_DISPLAY_NAME: Autoapi
  BIN_DIR: build/bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  VERSION: '{{.VERSION | default "dev"}}'
  BUILD: '{{.BUILD | default ""}}'
  VERSION_LDFLAGS: '-X main.appVersion={{.VERSION}}{{if .BUILD}} -X main.appBuild={{.BUILD}}{{end}}'

tasks:
  ## Development

  dev:
    summary: Runs the application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:frontend:
    summary: Runs the Vite dev server (WAILS_VITE_PORT is set by wails3 dev)
    dir: frontend
    cmds:
      - npm run dev

  run:
    summary: Builds (if needed) and runs the application
    vars:
      GOOS: '{{.GOOS | default OS}}'
    deps:
      - task: build
        vars:
          DEV:
            ref: .DEV
    cmds:
      - task: run:built

  run:built:
    summary: Runs the already-built binary for GOOS
    vars:
      GOOS: '{{.GOOS | default OS}}'
    cmds:
      - task: '{{if eq .GOOS "darwin"}}run:darwin{{else}}run:binary{{end}}'

  run:binary:
    internal: true
    vars:
      GOOS: '{{.GOOS | default OS}}'
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}{{if eq .GOOS "windows"}}.exe{{end}}"'

  run:darwin:
    internal: true
    platforms: [darwin]
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources/"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/"
      - cp build/darwin/Info.dev.plist "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  ## Build

  build:
    summary: Builds the application for GOOS (default host)
    vars:
      GOOS: '{{.GOOS | default OS}}'
      TARGET_ARCH: '{{.ARCH | default .GOARCH | default ARCH}}'
    deps:
      - task: generate:bindings
      - task: generate:icons
      - task: build:frontend
        vars:
          DEV:
            ref: .DEV
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      # Go 1.27 refuses to overwrite an existing fat Mach-O with a thin one,
      # so a leftover universal build would break every later build.
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}{{if eq .GOOS "windows"}}.exe{{end}}"
      # Windows resources: PE subsystem, icon, version info and manifest.
      # Plain `go build` does not generate these, so the resource object is
      # produced here and consumed by the linker via its filename suffix
      # (wails_windows_<arch>.syso is only linked into Windows builds).
      - '{{if eq .GOOS "windows"}}wails3 generate syso -arch {{.TARGET_ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_{{.TARGET_ARCH}}.syso{{else}}true{{end}}'
      - >-
        go build
        {{if eq .DEV "true"}}-tags dev -buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s{{if eq .GOOS "windows"}} -H windowsgui{{end}} {{.VERSION_LDFLAGS}}"{{end}}
        -o "{{.BIN_DIR}}/{{.APP_NAME}}{{if eq .GOOS "windows"}}.exe{{end}}" .
      - '{{if eq .GOOS "windows"}}rm -f wails_windows_{{.TARGET_ARCH}}.syso{{else}}true{{end}}'
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '{{if eq .GOOS "windows"}}0{{else}}1{{end}}'
      # macOS deployment-target flags must not leak into Linux cgo builds:
      # gcc rejects -mmacosx-version-min.
      CGO_CFLAGS: '{{if eq .GOOS "darwin"}}-mmacosx-version-min=12.0{{end}}'
      CGO_LDFLAGS: '{{if eq .GOOS "darwin"}}-mmacosx-version-min=12.0{{end}}'
      MACOSX_DEPLOYMENT_TARGET: '{{if eq .GOOS "darwin"}}12.0{{end}}'

  build:frontend:
    summary: Builds the frontend bundle embedded in the binary
    deps:
      - task: install:frontend:deps
    cmds:
      # Dev builds are served by Vite, so a production bundle is only needed
      # the first time (//go:embed requires frontend/dist to exist).
      - '{{if eq .DEV "true"}}test -f frontend/dist/index.html || (cd frontend && npm run build){{else}}cd frontend && npm run build{{end}}'

  install:frontend:deps:
    summary: Installs frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install

  generate:bindings:
    summary: Regenerates the TypeScript bindings from the Go service
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      # No -i: class models keep the `new model.Foo({...})` construction style
      # used throughout the Vue code.
      - wails3 generate bindings -ts -clean

  generate:icons:
    summary: Regenerates the platform icons from build/appicon.png
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  generate:
    summary: Alias for generate:bindings
    cmds:
      - task: generate:bindings

  ## Packaging

  package:
    summary: Packages the application (macOS .app bundle; binary elsewhere)
    vars:
      GOOS: '{{.GOOS | default OS}}'
    deps:
      - task: build
    cmds:
      - task: '{{if eq .GOOS "darwin"}}package:darwin{{else}}package:binary{{end}}'

  package:binary:
    internal: true
    vars:
      GOOS: '{{.GOOS | default OS}}'
    cmds:
      - 'echo "Packaged binary: {{.BIN_DIR}}/{{.APP_NAME}}{{if eq .GOOS "windows"}}.exe{{end}}"'

  package:darwin:
    internal: true
    platforms: [darwin]
    cmds:
      # The bundle is named after the product (Autoapi.app) while the
      # executable inside keeps the lowercase binary name; CFBundleExecutable
      # must keep matching it.
      - rm -rf "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app/Contents/Resources/"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app/Contents/MacOS/"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app/Contents/"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app"

  package:dmg:
    summary: Builds the macOS .app and wraps it in a DMG (build/bin/<app>.dmg)
    platforms: [darwin]
    deps:
      - task: package
    cmds:
      # `wails3 tool package` expects build/bin/<app>.app and writes <app>.dmg.
      - wails3 tool package -format dmg -name {{.APP_DISPLAY_NAME}} -out {{.BIN_DIR}} -volume-icon build/darwin/icons.icns
      - mv -f "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.dmg" "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}.dmg"

  package:universal:
    summary: Builds a universal (arm64 + amd64) macOS .app and DMG
    platforms: [darwin]
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - GOOS=darwin GOARCH=arm64 wails3 task build VERSION={{.VERSION}} BUILD={{.BUILD}}
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - GOOS=darwin GOARCH=amd64 wails3 task build VERSION={{.VERSION}} BUILD={{.BUILD}}
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: package:darwin
      - wails3 tool package -format dmg -name {{.APP_DISPLAY_NAME}} -out {{.BIN_DIR}} -volume-icon build/darwin/icons.icns
      - mv -f "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.dmg" "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-universal.dmg"

  package:release:
    summary: Builds the macOS release artifacts (universal DMG + auto-update zip + SHA256SUMS)
    platforms: [darwin]
    deps:
      - task: package:universal
    cmds:
      # The updater only installs .zip archives; the DMG stays the manual
      # install. Both hashes land in SHA256SUMS, which the updater's GitHub
      # provider reads (ChecksumAsset) to verify the download.
      # The updater rejects archives with more than one top-level entry, so no
      # --sequesterRsrc: that flag adds a __MACOSX/ sidecar tree.
      - ditto -c -k --keepParent "{{.BIN_DIR}}/{{.APP_DISPLAY_NAME}}.app" "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-darwin-universal.zip"
      - cd "{{.BIN_DIR}}" && shasum -a 256 "{{.APP_NAME}}-{{.VERSION}}-darwin-universal.zip" "{{.APP_NAME}}-{{.VERSION}}-universal.dmg" > SHA256SUMS

  clean:
    summary: Removes build artifacts
    cmds:
      - rm -rf "{{.BIN_DIR}}" frontend/dist
      - rm -f wails_windows_*.syso
